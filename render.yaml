services:
  - type: web
    name: jarvis
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    disk:
      name: chroma-data
      mountPath: /chroma_data
      sizeGB: 1
    envVars:
      - key: APP_NAME
        value: Jarvis
      - key: DEBUG
        value: false
      - key: MODEL_NAME
        value: claude-sonnet-4-6
      - key: CHROMA_PATH
        value: /chroma_data
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_REFRESH_TOKEN
        sync: false
      - key: ONENOTE_NOTEBOOK
        value: Personal
      - key: ONENOTE_SECTIONS
        value: '["Coding 2026"]'
      - key: API_KEY
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_TRACING
        value: true
      - key: LANGSMITH_PROJECT
        value: jarvis
